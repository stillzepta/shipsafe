<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: none; stroke: #111827; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .ink-bold { fill: none; stroke: #111827; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #111827; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 6 6; }
      
      /* Xiaohei Solid Black Silhouette */
      .xiaohei { fill: #111827; stroke: #111827; stroke-width: 1.5; }
      .xiaohei-eye { fill: #ffffff; }
      
      /* Functional Color Accents */
      .accent-red { stroke: #ef4444; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .fill-red { fill: #ef4444; }
      .bg-red-tint { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      
      .accent-orange { stroke: #f97316; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .fill-orange { fill: #f97316; }
      .bg-orange-tint { fill: #ffedd5; stroke: #f97316; stroke-width: 2; }
      
      .accent-blue { stroke: #3b82f6; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .fill-blue { fill: #3b82f6; }
      .bg-blue-tint { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      
      .fill-green { fill: #10b981; }
      .accent-green { stroke: #10b981; fill: none; stroke-width: 2.6; }

      /* Typography */
      .font-hand { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 700; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
      .txt-title { font-size: 26px; fill: #111827; letter-spacing: -0.5px; }
      .txt-sub { font-size: 14px; fill: #6b7280; }
      .txt-tag { font-size: 13px; font-weight: bold; }
      .txt-code { font-size: 13px; fill: #374151; font-family: monospace; }
    </style>
  </defs>

  <!-- 1. Pure White Background (16:9) -->
  <rect width="1600" height="900" class="bg"/>

  <!-- ==================== HEADER & TITLE ==================== -->
  <g transform="translate(100, 60)">
    <text x="0" y="32" class="font-sans txt-title">ShipSafe Pre-Flight Quality Gate Architecture</text>
    <text x="0" y="58" class="font-sans txt-sub">Hand-Drawn System Blueprint (Ian Xiaohei English Edition) — Local Prevention Engine</text>
    
    <!-- Legend Pill -->
    <g transform="translate(1050, 10)">
      <rect x="0" y="0" width="350" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.8"/>
      <circle cx="28" cy="23" r="6" fill="#ef4444"/>
      <text x="42" y="27" class="font-sans" font-size="12" fill="#374151">Blocked / Hazard</text>
      <circle cx="160" cy="23" r="6" fill="#f97316"/>
      <text x="174" y="27" class="font-sans" font-size="12" fill="#374151">Auto-Remediate</text>
      <circle cx="285" cy="23" r="6" fill="#3b82f6"/>
      <text x="299" y="27" class="font-sans" font-size="12" fill="#374151">Approved</text>
    </g>
  </g>

  <!-- Ground Line -->
  <path d="M 80,780 L 1520,780" class="ink-thin dashed" stroke="#d1d5db"/>

  <!-- ==================== STAGE 1: INCOMING CODE STREAM (LEFT) ==================== -->
  <g transform="translate(120, 260)">
    <!-- Stage Label -->
    <rect x="0" y="-40" width="170" height="26" rx="4" class="bg-blue-tint"/>
    <text x="12" y="-23" class="font-sans txt-tag fill-blue">1. LOCAL STAGING</text>
    
    <!-- Conveyor Belt -->
    <path d="M 10,240 L 290,240" class="ink-bold"/>
    <circle cx="30" cy="255" r="14" class="ink"/>
    <circle cx="150" cy="255" r="14" class="ink"/>
    <circle cx="270" cy="255" r="14" class="ink"/>
    
    <!-- Staged Files Moving on Conveyor -->
    <!-- File 1: clean code -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="85" height="110" rx="6" fill="#ffffff" class="ink"/>
      <line x1="16" y1="25" x2="65" y2="25" class="ink-thin"/>
      <line x1="16" y1="42" x2="55" y2="42" class="ink-thin"/>
      <line x1="16" y1="59" x2="70" y2="59" class="ink-thin"/>
      <text x="16" y="92" class="font-hand txt-code">auth.js</text>
    </g>

    <!-- File 2: Dangerous Secret Leak! -->
    <g transform="translate(130, 40)">
      <rect x="0" y="0" width="95" height="130" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2.4"/>
      <line x1="16" y1="25" x2="75" y2="25" class="ink-thin" stroke="#ef4444"/>
      <rect x="14" y="44" width="68" height="24" rx="4" fill="#ef4444"/>
      <text x="18" y="60" class="font-hand" font-size="10" fill="#ffffff">AKIA...KEY</text>
      <text x="16" y="92" class="font-hand txt-code">.env.prod</text>
      <text x="16" y="112" class="font-sans" font-size="11" fill="#ef4444">LEAK DETECTED</text>
      <!-- Red warning halo -->
      <path d="M 47, -25 L 47, -5" class="accent-red"/>
      <path d="M 27, -18 L 37, -3" class="accent-red"/>
      <path d="M 67, -18 L 57, -3" class="accent-red"/>
      <text x="8" y="-32" class="font-sans txt-tag fill-red">STAGED SECRET!</text>
    </g>

    <!-- Xiaohei #1 (Developer at terminal) -->
    <g transform="translate(-40, 150)">
      <!-- Body -->
      <ellipse cx="40" cy="55" rx="16" ry="24" class="xiaohei"/>
      <!-- Head -->
      <circle cx="40" cy="20" r="14" class="xiaohei"/>
      <!-- Eyes -->
      <circle cx="36" cy="18" r="2.2" class="xiaohei-eye"/>
      <circle cx="44" cy="18" r="2.2" class="xiaohei-eye"/>
      <!-- Legs -->
      <line x1="32" y1="78" x2="26" y2="120" class="ink-bold"/>
      <line x1="48" y1="78" x2="54" y2="120" class="ink-bold"/>
      <!-- Arms pushing commit -->
      <path d="M 40,45 Q 65,55 80,48" class="ink-bold"/>
      <text x="-15" y="145" class="font-sans" font-size="13" fill="#111827">git commit -m "..."</text>
    </g>

    <text x="35" y="295" class="font-sans" font-size="13" fill="#6b7280">Local Staged Buffer</text>
  </g>

  <!-- Flow Arrow from Staging to Sentry -->
  <g transform="translate(430, 420)">
    <path d="M 0,0 L 70,0" class="ink-bold dashed"/>
    <polygon points="70,-6 84,0 70,6" fill="#111827"/>
    <text x="10" y="-12" class="font-sans" font-size="12" fill="#6b7280">&lt; 10ms trigger</text>
  </g>

  <!-- ==================== STAGE 2: SHIIPSAFE GATEHOUSE (CENTER) ==================== -->
  <g transform="translate(530, 180)">
    <!-- Stage Label -->
    <rect x="0" y="40" width="220" height="26" rx="4" class="bg-orange-tint"/>
    <text x="12" y="57" class="font-sans txt-tag fill-orange">2. PRE-FLIGHT QUALITY GATE</text>

    <!-- Main Machine Box -->
    <rect x="0" y="80" width="460" height="420" rx="14" fill="#ffffff" class="ink-bold"/>

    <!-- Radar Meter Header -->
    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="400" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Radar Circle -->
      <circle cx="45" cy="35" r="24" class="ink"/>
      <path d="M 45,35 L 62,24" class="accent-green"/>
      <circle cx="45" cy="35" r="4" fill="#10b981"/>
      <text x="85" y="32" class="font-sans" font-size="15" fill="#111827">HEALTH SCORE: <tspan fill="#10b981" font-weight="bold">100 / 100</tspan></text>
      <text x="85" y="52" class="font-hand txt-code" font-size="11" fill="#6b7280">SQLite Audit: .shipsafe/audit.db</text>
    </g>

    <!-- 5 Multi-Stage Check Chutes -->
    <g transform="translate(30, 200)">
      <!-- Rule 1: Secrets -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="395" height="42" rx="6" fill="#ffffff" class="ink-thin"/>
        <circle cx="22" cy="21" r="9" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="18" y="25" class="font-sans" font-size="11" fill="#ef4444">🛡️</text>
        <text x="40" y="24" class="font-sans" font-size="12" fill="#111827">Secrets &amp; Credentials Scanner</text>
        <text x="260" y="24" class="font-hand" font-size="11" fill="#ef4444">AWS/Stripe/JWT</text>
      </g>
      <!-- Rule 2: Hygiene -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="395" height="42" rx="6" fill="#ffffff" class="ink-thin"/>
        <circle cx="22" cy="21" r="9" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
        <text x="18" y="25" class="font-sans" font-size="11" fill="#f97316">🧹</text>
        <text x="40" y="24" class="font-sans" font-size="12" fill="#111827">Code Hygiene &amp; Smells</text>
        <text x="260" y="24" class="font-hand" font-size="11" fill="#f97316">debugger / logs</text>
      </g>
      <!-- Rule 3: Git Guard -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="395" height="42" rx="6" fill="#ffffff" class="ink-thin"/>
        <circle cx="22" cy="21" r="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="18" y="25" class="font-sans" font-size="11" fill="#3b82f6">🌿</text>
        <text x="40" y="24" class="font-sans" font-size="12" fill="#111827">Git Guard &amp; Branch Policy</text>
        <text x="260" y="24" class="font-hand" font-size="11" fill="#3b82f6">main / bloat / .env</text>
      </g>
      <!-- Rule 4: Syntax -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="395" height="42" rx="6" fill="#ffffff" class="ink-thin"/>
        <circle cx="22" cy="21" r="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
        <text x="18" y="25" class="font-sans" font-size="11" fill="#6366f1">🔍</text>
        <text x="40" y="24" class="font-sans" font-size="12" fill="#111827">Syntax &amp; ESM Integrity</text>
        <text x="260" y="24" class="font-hand" font-size="11" fill="#6366f1">node --check/JSON</text>
      </g>
      <!-- Rule 5: Dependencies -->
      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="395" height="42" rx="6" fill="#ffffff" class="ink-thin"/>
        <circle cx="22" cy="21" r="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="18" y="25" class="font-sans" font-size="11" fill="#d97706">📦</text>
        <text x="40" y="24" class="font-sans" font-size="12" fill="#111827">Dependency &amp; Lockfile Sync</text>
        <text x="260" y="24" class="font-hand" font-size="11" fill="#d97706">package-lock.json</text>
      </g>
    </g>

    <!-- Central Sentry: Xiaohei Operator on Gatehouse Roof -->
    <g transform="translate(200, -55)">
      <!-- Ladder to roof -->
      <line x1="20" y1="50" x2="20" y2="135" class="ink-thin"/>
      <line x1="40" y1="50" x2="40" y2="135" class="ink-thin"/>
      <line x1="20" y1="70" x2="40" y2="70" class="ink-thin"/>
      <line x1="20" y1="90" x2="40" y2="90" class="ink-thin"/>
      <line x1="20" y1="110" x2="40" y2="110" class="ink-thin"/>

      <!-- Xiaohei Chief Inspector -->
      <!-- Body -->
      <ellipse cx="80" cy="50" rx="18" ry="26" class="xiaohei"/>
      <!-- Head -->
      <circle cx="80" cy="14" r="16" class="xiaohei"/>
      <!-- Headset -->
      <path d="M 66,10 A 15,15 0 0,1 94,10" class="accent-orange"/>
      <rect x="62" y="8" width="6" height="12" rx="2" fill="#f97316"/>
      <!-- Eyes -->
      <circle cx="76" cy="12" r="2.5" class="xiaohei-eye"/>
      <circle cx="84" cy="12" r="2.5" class="xiaohei-eye"/>
      <!-- Legs sitting on edge -->
      <path d="M 72,75 L 72,105 L 80,105" class="ink-bold"/>
      <path d="M 88,75 L 88,105 L 96,105" class="ink-bold"/>
      <!-- Arms holding giant magnifying glass down at code -->
      <path d="M 70,40 Q 40,30 30,55" class="ink-bold"/>
      <!-- Magnifying Glass -->
      <circle cx="25" cy="65" r="18" class="ink-bold" stroke="#3b82f6"/>
      <line x1="38" y1="77" x2="52" y2="92" class="ink-bold"/>
      <text x="-40" y="10" class="font-sans" font-size="12" fill="#f97316">Xiaohei Operator</text>
    </g>

    <!-- Server Live Indicator -->
    <g transform="translate(140, 520)">
      <circle cx="10" cy="10" r="5" fill="#10b981"/>
      <text x="24" y="14" class="font-sans" font-size="12" fill="#111827">Local Server: <tspan fill="#3b82f6">http://localhost:4100</tspan> (Live SSE)</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: DECISION FORK (RIGHT) ==================== -->
  
  <!-- FORK PATH A: REJECTED & AUTO-FIX (TOP RIGHT) -->
  <g transform="translate(1080, 180)">
    <!-- Rejected Red Line -->
    <path d="M -90,200 C -20,200 0,120 70,120" class="accent-red" stroke-width="3"/>
    <polygon points="70,114 84,120 70,126" fill="#ef4444"/>

    <!-- Quarantine Bin -->
    <rect x="90" y="40" width="370" height="180" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.4"/>
    <rect x="90" y="40" width="370" height="34" rx="10" fill="#fee2e2"/>
    <text x="110" y="63" class="font-sans txt-tag fill-red">✖ BLOCKED (Exit Code 1)</text>
    <text x="310" y="63" class="font-hand" font-size="12" fill="#ef4444">Commit Prevented</text>

    <!-- Quarantined items -->
    <g transform="translate(110, 90)">
      <rect x="0" y="0" width="160" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="12" y="22" class="font-hand" font-size="12" fill="#991b1b">.env file un-staged</text>
      
      <rect x="175" y="0" width="160" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="12" y="22" class="font-hand" font-size="12" fill="#991b1b">debugger; removed</text>

      <text x="5" y="65" class="font-sans" font-size="13" fill="#374151">Auto-Remediation Engine:</text>
      <text x="5" y="85" class="font-hand" font-size="12" fill="#f97316">⚡ npx shipsafe fix (or 1-click UI)</text>
      <text x="5" y="105" class="font-sans" font-size="11" fill="#6b7280">Secrets never reach Git remote commit tree</text>
    </g>

    <!-- Xiaohei Assistant #2 (Sweeping bugs into bin) -->
    <g transform="translate(470, 70)">
      <!-- Body -->
      <ellipse cx="25" cy="50" rx="14" ry="22" class="xiaohei"/>
      <!-- Head -->
      <circle cx="25" cy="18" r="13" class="xiaohei"/>
      <!-- Eyes -->
      <circle cx="21" cy="16" r="2" class="xiaohei-eye"/>
      <circle cx="29" cy="16" r="2" class="xiaohei-eye"/>
      <!-- Broom / Wrench -->
      <line x1="25" y1="45" x2="-10" y2="75" class="accent-orange" stroke-width="3"/>
      <rect x="-20" y="70" width="14" height="18" rx="2" fill="#f97316"/>
      <line x1="18" y1="70" x2="12" y2="105" class="ink-bold"/>
      <line x1="32" y1="70" x2="38" y2="105" class="ink-bold"/>
      <text x="-15" y="125" class="font-sans" font-size="11" fill="#f97316">Auto-Fixer</text>
    </g>
  </g>

  <!-- FORK PATH B: VERIFIED CLEAN RELEASE (BOTTOM RIGHT) -->
  <g transform="translate(1080, 480)">
    <!-- Approved Blue Line -->
    <path d="M -90,-40 C -20,-40 0,60 70,60" class="accent-blue" stroke-width="3.5"/>
    <polygon points="70,54 84,60 70,66" fill="#3b82f6"/>

    <!-- Approved Destination Gate -->
    <rect x="90" y="-10" width="370" height="210" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2.4"/>
    <rect x="90" y="-10" width="370" height="34" rx="10" fill="#dbeafe"/>
    <text x="110" y="13" class="font-sans txt-tag fill-blue">✔ APPROVED (Ready to Ship)</text>
    <text x="330" y="13" class="font-hand" font-size="12" fill="#3b82f6">Exit Code 0</text>

    <!-- Verified Code Blocks -->
    <g transform="translate(110, 40)">
      <!-- Safe clean file box -->
      <rect x="0" y="0" width="155" height="65" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
      <text x="12" y="24" class="font-hand" font-size="12" fill="#166534">auth.js [CLEAN]</text>
      <text x="12" y="44" class="font-sans" font-size="11" fill="#15803d">✔ 0 Secrets, 0 Smells</text>

      <rect x="170" y="0" width="165" height="65" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
      <text x="12" y="24" class="font-hand" font-size="12" fill="#166534">package-lock.json</text>
      <text x="12" y="44" class="font-sans" font-size="11" fill="#15803d">✔ Synced Manifest</text>

      <!-- Target Cloud -->
      <g transform="translate(20, 85)">
        <path d="M 20,40 A 20,20 0 0,1 60,30 A 30,30 0 0,1 115,25 A 25,25 0 0,1 150,45 A 15,15 0 0,1 135,65 L 20,65 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="45" y="52" class="font-sans" font-size="14" font-weight="bold" fill="#1e40af">GitHub / Remote</text>
        <text x="165" y="48" class="font-sans" font-size="12" fill="#1e40af">CI Builds Pass 100%</text>
        <text x="165" y="66" class="font-sans" font-size="11" fill="#6b7280">No failed 15min runs</text>
      </g>
    </g>

    <!-- Xiaohei Assistant #3 (Signaling thumbs up at ship dock) -->
    <g transform="translate(470, 45)">
      <!-- Body -->
      <ellipse cx="25" cy="50" rx="14" ry="22" class="xiaohei"/>
      <!-- Head -->
      <circle cx="25" cy="18" r="13" class="xiaohei"/>
      <!-- Eyes -->
      <circle cx="21" cy="16" r="2" class="xiaohei-eye"/>
      <circle cx="29" cy="16" r="2" class="xiaohei-eye"/>
      <!-- Hand signaling flag -->
      <line x1="25" y1="40" x2="45" y2="15" class="ink-bold"/>
      <polygon points="45,15 65,10 45,25" fill="#10b981"/>
      <line x1="18" y1="70" x2="12" y2="105" class="ink-bold"/>
      <line x1="32" y1="70" x2="38" y2="105" class="ink-bold"/>
      <text x="-5" y="125" class="font-sans" font-size="11" fill="#10b981">Shipped ✔</text>
    </g>
  </g>

  <!-- ==================== FOOTER SPECIFICATION NOTE ==================== -->
  <g transform="translate(100, 830)">
    <text x="0" y="0" class="font-hand txt-code" font-size="12" fill="#4b5563">
      [STYLE: Ian Xiaohei 16:9 Landscape | Pure White #FFFFFF | Hand-Drawn Ink Linework | Accents: Red #EF4444, Orange #F97316, Blue #3B82F6]
    </text>
    <text x="0" y="20" class="font-sans" font-size="12" fill="#9ca3af">
      Mandatory Rule: This illustration and README visual map must be maintained and updated with every code push and architecture update.
    </text>
  </g>
</svg>
