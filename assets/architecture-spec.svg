    <text x="10" y="19" class="font-sans" font-size="13" font-weight="800" fill="#ea580c">🎃 ARCHITECTURE SPECIFICATION</text>

    <text x="0" y="58" class="font-sans txt-title">ShipSafe // The Deep Pattern Sieve &amp; Dependency DAG Lab</text>
    <text x="0" y="82" class="font-sans txt-sub">How Bablu performs pattern code autopsies, maps blast radius ripple, and runs sovereign pre-mortems</text>
    
    <!-- Legend -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="480" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="28" cy="24" r="7" fill="#7c3aed"/>
      <text x="44" y="29" class="font-sans" font-size="13.5" font-weight="700" fill="#374151">Pattern Sieve</text>
      <circle cx="205" cy="24" r="7" fill="#2563eb"/>
      <text x="221" y="29" class="font-sans" font-size="13.5" font-weight="700" fill="#374151">Dependency DAG</text>
      <circle cx="370" cy="24" r="7" fill="#10b981"/>
      <text x="386" y="29" class="font-sans" font-size="13.5" font-weight="700" fill="#374151">Dual Brains</text>
    </g>
