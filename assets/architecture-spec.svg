        <text x="10" y="22" class="font-hand" font-size="12.5" font-weight="bold" fill="#9a3412">MemberExpression: process.env.STRIPE_KEY</text>
        <text x="10" y="38" class="font-sans" font-size="11.5" font-weight="700" fill="#ea580c">👻 Phantom Secret: Missing from .env.example</text>
