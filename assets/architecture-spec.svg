      <text x="15" y="24" class="font-sans" font-size="14" font-weight="800" fill="#111827">Graph Architecture Highlights:</text>
      <text x="15" y="48" class="font-sans" font-size="12.5" font-weight="600" fill="#4b5563">• In-memory reverse import adjacency list ($O(V + E)$)</text>
      <text x="15" y="70" class="font-sans" font-size="12.5" font-weight="600" fill="#4b5563">• Fast traversal halts recursive circular dependency traps</text>
      <text x="15" y="92" class="font-sans" font-size="12.5" font-weight="600" fill="#4b5563">• Emits visual ASCII DAG for CLI and Markdown for PRs</text>
      <text x="15" y="116" class="font-hand" font-size="12" font-weight="bold" fill="#2563eb">Topology Speed: &lt;5ms for 1,200 import edges</text>
