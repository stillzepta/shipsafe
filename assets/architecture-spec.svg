      <rect x="0" y="0" width="395" height="220" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
      <text x="15" y="25" class="font-hand" font-size="13" font-weight="bold" fill="#6b21a8">FILE: checkout.ts &amp; migration.sql</text>

      <!-- Pattern Nodes Floating -->
      <!-- Node A: N+1 Loop Monster -->
      <g transform="translate(15, 42)">
        <rect x="0" y="0" width="365" height="48" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
        <text x="10" y="22" class="font-hand" font-size="12.5" font-weight="bold" fill="#991b1b">ForOfStatement ➔ CallExpression</text>
        <text x="10" y="38" class="font-sans" font-size="11.5" font-weight="700" fill="#ef4444">🧟 N+1 Loop Spawning Ground: await db.query() in loop</text>
