        <path d="M 5,15 L 5,50 A 20,8 0 0,0 45,50 L 45,15 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
        <ellipse cx="25" cy="50" rx="20" ry="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.8"/>
        <text x="65" y="24" class="font-sans" font-size="12.5" font-weight="700" fill="#047857">Native node:sqlite Integration</text>
        <text x="65" y="44" class="font-sans" font-size="12" fill="#4b5563">Stores runs, scores, findings, and durations</text>
        <text x="65" y="62" class="font-sans" font-size="12" fill="#4b5563">Powers real-time SSE stream on port :4100</text>
      </g>
      <text x="15" y="122" class="font-hand" font-size="11.5" font-weight="bold" fill="#047857">Zero npm dependencies · Portable single-file storage</text>
