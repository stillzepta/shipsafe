        <text x="65" y="52" class="font-sans" font-size="12" font-weight="600" fill="#7c2d12">Instant &lt;2ms execution if Ollama daemon is offline</text>
        <text x="65" y="72" class="font-sans" font-size="12" font-weight="600" fill="#4b5563">Guarantees ShipSafe NEVER crashes or blocks commits</text>
        <text x="65" y="90" class="font-hand" font-size="11.5" font-weight="bold" fill="#ea580c">100% Reliability Guarantee under any environment</text>
