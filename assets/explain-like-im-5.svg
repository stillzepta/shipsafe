<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: none; stroke: #111827; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .ink-bold { fill: none; stroke: #111827; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #111827; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 6 6; }
      
      /* Xiaohei Solid Black Silhouette */
      .xiaohei { fill: #111827; stroke: #111827; stroke-width: 1.5; }
      .xiaohei-eye { fill: #ffffff; }
      
      /* Accents */
      .accent-red { stroke: #ef4444; fill: none; stroke-width: 2.6; }
      .fill-red { fill: #ef4444; }
      .accent-orange { stroke: #ea580c; fill: none; stroke-width: 2.6; }
      .fill-orange { fill: #ea580c; }
      .accent-blue { stroke: #2563eb; fill: none; stroke-width: 2.6; }
      .fill-blue { fill: #2563eb; }
      .fill-green { fill: #10b981; }
      .accent-green { stroke: #10b981; fill: none; stroke-width: 2.6; }

      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
      .font-hand { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 700; }
      .panel-border { fill: #ffffff; stroke: #111827; stroke-width: 2.4; rx: 12px; }
    </style>
  </defs>

  <!-- Pure White Canvas (16:9) -->
  <rect width="1600" height="900" class="bg"/>

  <!-- Header -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
    <text x="10" y="17" class="font-sans" font-size="12" font-weight="bold" fill="#ea580c">🎃 EXPLAIN LIKE I'M 5 YEARS OLD</text>
    <text x="0" y="60" class="font-sans" font-size="28" font-weight="800" fill="#111827">Xiaohei and the Spooky Code Monsters</text>
    <text x="0" y="85" class="font-sans" font-size="15" fill="#6b7280">How ShipSafe protects production from Halloween runtime ghosts before code leaves your computer</text>
  </g>

  <!-- ==================== 4-PANEL STORYBOARD ==================== -->

  <!-- PANEL 1: The Spooky Toy Castle -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="325" height="640" class="panel-border"/>
    <!-- Panel Header -->
    <rect x="0" y="0" width="325" height="42" rx="12" fill="#f8fafc"/>
    <text x="20" y="27" class="font-sans" font-size="14" font-weight="bold" fill="#ea580c">ACT 1: THE TOY CASTLE</text>

    <!-- Content: Developer building toy blocks with hidden ghosts -->
    <g transform="translate(40, 70)">
      <!-- Building Blocks -->
      <rect x="30" y="180" width="70" height="40" rx="4" fill="#ffffff" class="ink-bold"/>
      <rect x="105" y="180" width="70" height="40" rx="4" fill="#ffffff" class="ink-bold"/>
      <rect x="65" y="135" width="80" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2.6"/>

      <!-- Tiny Ghost peeking out of red brick -->
      <g transform="translate(80, 100)">
        <path d="M 10,30 C 10,12 38,12 38,30 C 38,36 34,34 32,38 C 30,34 26,36 24,38 C 22,34 18,36 16,38 C 14,34 10,36 10,30 Z" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
        <circle cx="18" cy="22" r="2" fill="#ef4444"/>
        <circle cx="28" cy="22" r="2" fill="#ef4444"/>
        <text x="42" y="26" class="font-hand" font-size="10" fill="#ef4444">"BOO!"</text>
      </g>

      <!-- Xiaohei the young builder -->
      <g transform="translate(140, 110)">
        <ellipse cx="30" cy="65" rx="15" ry="24" class="xiaohei"/>
        <circle cx="30" cy="28" r="14" class="xiaohei"/>
        <!-- Eyes looking happy -->
        <circle cx="26" cy="26" r="2" class="xiaohei-eye"/>
        <circle cx="34" cy="26" r="2" class="xiaohei-eye"/>
        <!-- Arm holding another block -->
        <line x1="30" y1="55" x2="65" y2="40" class="ink-bold"/>
        <rect x="65" y="30" width="30" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
      </g>
    </g>

    <!-- Narrative text -->
    <g transform="translate(25, 380)">
      <text x="0" y="20" class="font-sans" font-size="16" font-weight="bold" fill="#111827">You build something cool!</text>
      <text x="0" y="45" class="font-sans" font-size="13" fill="#4b5563">Every developer writes code like</text>
      <text x="0" y="65" class="font-sans" font-size="13" fill="#4b5563">building a giant LEGO castle.</text>
      <text x="0" y="95" class="font-sans" font-size="13" fill="#ef4444" font-weight="bold">BUT SNEAKY GHOSTS HIDE</text>
      <text x="0" y="115" class="font-sans" font-size="13" fill="#ef4444">inside the bricks: database table locks,</text>
      <text x="0" y="135" class="font-sans" font-size="13" fill="#ef4444">missing secret keys, and zombie loops!</text>
      <text x="0" y="165" class="font-sans" font-size="12" fill="#6b7280">Regular linters can't see them at all.</text>
    </g>
  </g>

  <!-- PANEL 2: Without ShipSafe (Disaster) -->
  <g transform="translate(455, 160)">
    <rect x="0" y="0" width="325" height="640" class="panel-border" stroke="#ef4444"/>
    <!-- Panel Header -->
    <rect x="0" y="0" width="325" height="42" rx="12" fill="#fee2e2"/>
    <text x="20" y="27" class="font-sans" font-size="14" font-weight="bold" fill="#991b1b">ACT 2: WITHOUT SHIPSAFE 💥</text>

    <!-- Content: Code explodes in production -->
    <g transform="translate(50, 70)">
      <!-- Broken Server Tower -->
      <rect x="30" y="120" width="100" height="110" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
      <line x1="45" y1="145" x2="115" y2="145" class="ink-thin" stroke="#ef4444"/>
      <line x1="45" y1="170" x2="115" y2="170" class="ink-thin" stroke="#ef4444"/>
      <!-- Crack lines in server -->
      <path d="M 80,120 L 70,160 L 95,190 L 85,230" class="accent-red" stroke-width="3"/>

      <!-- Giant Table Lock Monster screaming -->
      <g transform="translate(130, 80)">
        <ellipse cx="35" cy="30" rx="28" ry="24" fill="#ef4444"/>
        <!-- Horns -->
        <polygon points="15,18 20,2 25,18" fill="#991b1b"/>
        <polygon points="45,18 50,2 55,18" fill="#991b1b"/>
        <circle cx="26" cy="26" r="4" fill="#ffffff"/>
        <circle cx="44" cy="26" r="4" fill="#ffffff"/>
        <circle cx="26" cy="26" r="2" fill="#111827"/>
        <circle cx="44" cy="26" r="2" fill="#111827"/>
        <!-- Giant roar mouth -->
        <ellipse cx="35" cy="40" rx="14" ry="8" fill="#991b1b"/>
      </g>

      <!-- Xiaohei crying -->
      <g transform="translate(0, 160)">
        <ellipse cx="25" cy="45" rx="12" ry="18" class="xiaohei"/>
        <circle cx="25" cy="18" r="11" class="xiaohei"/>
        <!-- Tear drops -->
        <circle cx="22" cy="18" r="1.5" class="xiaohei-eye"/>
        <circle cx="28" cy="18" r="1.5" class="xiaohei-eye"/>
        <path d="M 32,20 L 36,28" class="accent-blue"/>
        <path d="M 18,20 L 14,28" class="accent-blue"/>
      </g>
    </g>

    <!-- Narrative text -->
    <g transform="translate(25, 380)">
      <text x="0" y="20" class="font-sans" font-size="16" font-weight="bold" fill="#ef4444">The 3 AM Nightmare!</text>
      <text x="0" y="45" class="font-sans" font-size="13" fill="#4b5563">You ship your code to the cloud.</text>
      <text x="0" y="65" class="font-sans" font-size="13" fill="#4b5563">At midnight, the ghosts wake up!</text>
      <text x="0" y="95" class="font-sans" font-size="13" fill="#991b1b" font-weight="bold">The database locks up completely.</text>
      <text x="0" y="115" class="font-sans" font-size="13" fill="#4b5563">The website crashes, customers can't buy</text>
      <text x="0" y="135" class="font-sans" font-size="13" fill="#4b5563">their toys, and the CEO cries.</text>
      <text x="0" y="165" class="font-hand" font-size="13" fill="#ef4444" font-weight="bold">Cost: $120,000 lost in 45 minutes!</text>
    </g>
  </g>

  <!-- PANEL 3: Xiaohei the Ghostbuster (ShipSafe Gatekeeper) -->
  <g transform="translate(810, 160)">
    <rect x="0" y="0" width="325" height="640" class="panel-border" stroke="#ea580c"/>
    <!-- Panel Header -->
    <rect x="0" y="0" width="325" height="42" rx="12" fill="#ffedd5"/>
    <text x="20" y="27" class="font-sans" font-size="14" font-weight="bold" fill="#9a3412">ACT 3: ENTER XIAOHEI 🛡️</text>

    <!-- Content: Xiaohei inspecting and vacuuming code ghosts -->
    <g transform="translate(40, 60)">
      <!-- Xiaohei Ghostbuster -->
      <g transform="translate(40, 70)">
        <ellipse cx="40" cy="70" rx="20" ry="30" class="xiaohei"/>
        <circle cx="40" cy="24" r="18" class="xiaohei"/>
        <!-- Ghostbuster Hat / Antenna -->
        <polygon points="25,12 40,-15 55,12" fill="#111827"/>
        <ellipse cx="40" cy="12" rx="22" ry="5" fill="#ea580c"/>
        <circle cx="35" cy="22" r="2.8" class="xiaohei-eye"/>
        <circle cx="45" cy="22" r="2.8" class="xiaohei-eye"/>
        <!-- Ghost Radar Scanner -->
        <circle cx="95" cy="45" r="22" stroke="#ea580c" stroke-width="3" fill="#fff7ed"/>
        <line x1="50" y1="55" x2="75" y2="48" class="ink-bold"/>
        <text x="83" y="52" class="font-hand" font-size="12" fill="#ea580c">100%</text>

        <!-- Ghost Vacuum Tube sucking up the monster -->
        <path d="M 40,85 Q 85,125 130,110" class="ink-bold" stroke="#ea580c" stroke-width="4"/>
        <rect x="130" y="95" width="25" height="30" rx="4" fill="#ea580c"/>
      </g>

      <!-- Trapped Ghost crying in a glass jar -->
      <g transform="translate(180, 130)">
        <rect x="0" y="0" width="60" height="75" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2.2"/>
        <rect x="10" y="-8" width="40" height="10" rx="3" fill="#ea580c"/>
        <!-- Sad tiny ghost inside -->
        <path d="M 18,50 C 18,30 42,30 42,50 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
        <circle cx="26" cy="42" r="2" fill="#ef4444"/>
        <circle cx="34" cy="42" r="2" fill="#ef4444"/>
        <text x="12" y="65" class="font-sans" font-size="9" fill="#991b1b">TRAPPED!</text>
      </g>
    </g>

    <!-- Narrative text -->
    <g transform="translate(25, 380)">
      <text x="0" y="20" class="font-sans" font-size="16" font-weight="bold" fill="#ea580c">The Brave Gatekeeper!</text>
      <text x="0" y="45" class="font-sans" font-size="13" fill="#4b5563">Before code leaves your computer,</text>
      <text x="0" y="65" class="font-sans" font-size="13" fill="#4b5563">Xiaohei steps in with ShipSafe!</text>
      <text x="0" y="95" class="font-sans" font-size="13" fill="#9a3412" font-weight="bold">In less than 20 milliseconds:</text>
      <text x="0" y="115" class="font-sans" font-size="13" fill="#4b5563">1. Finds every hidden ghost.</text>
      <text x="0" y="135" class="font-sans" font-size="13" fill="#4b5563">2. Measures how far it could explode.</text>
      <text x="0" y="155" class="font-sans" font-size="13" fill="#4b5563">3. Traps the hazard in quarantine!</text>
    </g>
  </g>

  <!-- PANEL 4: Auto-Fix & Golden Ticket (Happy Production) -->
  <g transform="translate(1165, 160)">
    <rect x="0" y="0" width="325" height="640" class="panel-border" stroke="#10b981"/>
    <!-- Panel Header -->
    <rect x="0" y="0" width="325" height="42" rx="12" fill="#d1fae5"/>
    <text x="20" y="27" class="font-sans" font-size="14" font-weight="bold" fill="#065f46">ACT 4: THE GOLDEN TICKET ✨</text>

    <!-- Content: Clean code floating peacefully to production -->
    <g transform="translate(50, 70)">
      <!-- Cloud City / Production -->
      <path d="M 20,40 A 25,25 0 0,1 70,30 A 35,35 0 0,1 135,25 A 30,30 0 0,1 180,50 A 20,20 0 0,1 160,75 L 20,75 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
      <text x="50" y="58" class="font-sans" font-size="14" font-weight="bold" fill="#047857">Production ✔</text>

      <!-- Sparkling Clean Code Brick -->
      <g transform="translate(45, 110)">
        <rect x="0" y="0" width="120" height="55" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2.2"/>
        <text x="14" y="24" class="font-hand" font-size="12" fill="#047857">code [CLEAN]</text>
        <text x="14" y="44" class="font-sans" font-size="11" fill="#10b981">✨ 0 Ghosts Inside</text>
      </g>

      <!-- Xiaohei with thumbs up and green lantern -->
      <g transform="translate(50, 180)">
        <ellipse cx="30" cy="55" rx="16" ry="24" class="xiaohei"/>
        <circle cx="30" cy="20" r="14" class="xiaohei"/>
        <circle cx="26" cy="18" r="2.2" class="xiaohei-eye"/>
        <circle cx="34" cy="18" r="2.2" class="xiaohei-eye"/>
        <!-- Green lantern held high -->
        <line x1="30" y1="45" x2="65" y2="15" class="ink-bold"/>
        <circle cx="65" cy="15" r="9" fill="#10b981"/>
      </g>
    </g>

    <!-- Narrative text -->
    <g transform="translate(25, 380)">
      <text x="0" y="20" class="font-sans" font-size="16" font-weight="bold" fill="#10b981">Safe to Ship!</text>
      <text x="0" y="45" class="font-sans" font-size="13" fill="#4b5563">ShipSafe automatically fixes chores:</text>
      <text x="0" y="65" class="font-sans" font-size="13" fill="#047857" font-weight="bold">"shipsafe fix" fills missing keys</text>
      <text x="0" y="85" class="font-sans" font-size="13" fill="#4b5563">and cleans dirty code automatically.</text>
      <text x="0" y="115" class="font-sans" font-size="13" fill="#4b5563">Your code gets the Golden Ticket,</text>
      <text x="0" y="135" class="font-sans" font-size="13" fill="#4b5563">deploys smoothly on Halloween night,</text>
      <text x="0" y="155" class="font-sans" font-size="13" fill="#047857" font-weight="bold">and you sleep peacefully like a baby! 😴</text>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(100, 835)">
    <text x="0" y="0" class="font-hand" font-size="12" fill="#6b7280">
      Xiaohei Storyboard Concept: Translating complex AST AST-level database table lock detection and dependency blast radius into intuitive visual storytelling.
    </text>
  </g>
</svg>
