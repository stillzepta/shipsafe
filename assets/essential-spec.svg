<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: none; stroke: #111827; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-bold { fill: none; stroke: #111827; stroke-width: 4.8; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #111827; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 7 7; }
      
      /* Bablu Solid Black Silhouette */
      .bablu { fill: #111827; stroke: #111827; stroke-width: 2; }
      .bablu-eye { fill: #ffffff; }
      
      /* Spooky Functional Color Accents */
      .accent-red { stroke: #ef4444; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .fill-red { fill: #ef4444; }
      .bg-red-tint { fill: #fee2e2; stroke: #ef4444; stroke-width: 2.2; }
      
      .accent-orange { stroke: #ea580c; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .fill-orange { fill: #ea580c; }
      .bg-orange-tint { fill: #ffedd5; stroke: #ea580c; stroke-width: 2.2; }
      
      .accent-blue { stroke: #2563eb; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .fill-blue { fill: #2563eb; }
      .bg-blue-tint { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.2; }
      
      .fill-green { fill: #10b981; }
      .accent-green { stroke: #10b981; fill: none; stroke-width: 3.2; }
      .bg-green-tint { fill: #d1fae5; stroke: #10b981; stroke-width: 2.2; }

      .accent-purple { stroke: #7c3aed; fill: none; stroke-width: 3.2; stroke-linecap: round; }
      .fill-purple { fill: #7c3aed; }
      .bg-purple-tint { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.2; }

      /* Typography (Enlarged for High-DPI and Mobile Readability) */
      .font-hand { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 700; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
      .txt-title { font-size: 32px; fill: #111827; letter-spacing: -0.6px; font-weight: 900; }
      .txt-sub { font-size: 16.5px; fill: #4b5563; font-weight: 600; }
      .txt-tag { font-size: 13.5px; font-weight: 800; }
      .txt-code { font-size: 13px; fill: #374151; font-family: monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- 1. Pure White Background (16:9 widescreen canvas) -->
  <rect width="1600" height="900" class="bg"/>

  <!-- ==================== HEADER (OPERATIONAL RUNBOOK SPEC) ==================== -->
  <g transform="translate(70, 26)">
    <rect x="0" y="0" width="245" height="27" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="10" y="19" class="font-sans" font-size="13" font-weight="800" fill="#ea580c">🎃 RUNBOOK // OPERATOR SPEC</text>

    <text x="0" y="58" class="font-sans txt-title">ShipSafe // The Spooky Operator's Runbook &amp; Magic Terminal</text>
    <text x="0" y="82" class="font-sans txt-sub">Mastering the 4 core developer spells: scan, fix, commit, and serve for zero-downtime shipping</text>
    
    <!-- Legend -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="480" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="28" cy="24" r="7" fill="#ea580c"/>
      <text x="44" y="29" class="font-sans" font-size="13.5" font-weight="700" fill="#374151">4 Core Spells</text>
      <circle cx="195" cy="24" r="7" fill="#7c3aed"/>
      <text x="211" y="29" class="font-sans" font-size="13.5" font-weight="700" fill="#374151">10/10 Benchmark</text>
      <circle cx="365" cy="24" r="7" fill="#10b981"/>
      <text x="381" y="29" class="font-sans" font-size="13.5" font-weight="700" fill="#374151">Ports &amp; Hooks</text>
    </g>
  </g>

  <!-- Ground Line -->
  <path d="M 50,815 L 1550,815" class="ink-thin dashed" stroke="#e2e8f0"/>

  <!-- ==================== 3 RUNBOOK PILLARS ==================== -->

  <!-- PILLAR 1: THE 4 CORE DEVELOPER SPELLS (LEFT, Width: 520px) -->
  <g transform="translate(70, 160)">
    <rect x="0" y="0" width="510" height="630" rx="14" fill="#ffffff" class="ink-bold" stroke="#ea580c"/>
    <rect x="0" y="0" width="510" height="44" rx="14" fill="#ffedd5"/>
    <text x="20" y="28" class="font-sans txt-tag fill-orange">⚡ 1. THE 4 CORE DEVELOPER SPELLS (CLI COMMANDS)</text>

    <!-- Terminal Command Cards -->
    <g transform="translate(20, 60)">
      <!-- Spell 1: scan -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="470" height="82" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
        <rect x="10" y="10" width="34" height="34" rx="5" fill="#dbeafe"/>
        <text x="17" y="33" class="font-sans" font-size="18">🔍</text>
        <text x="54" y="28" class="font-hand" font-size="14.5" font-weight="bold" fill="#1e40af">node bin/shipsafe scan [--all]</text>
        <text x="54" y="48" class="font-sans" font-size="12" font-weight="600" fill="#4b5563">The Scrying Orb: Scans staged changes in &lt;35ms</text>
        <text x="54" y="66" class="font-sans" font-size="11.5" font-weight="700" fill="#2563eb">Outputs Radar Score (100/100) &amp; ANSI risk cards</text>
        <rect x="390" y="12" width="68" height="24" rx="4" fill="#dbeafe"/>
        <text x="398" y="28" class="font-sans" font-size="11" font-weight="800" fill="#1e40af">&lt; 35ms</text>
      </g>

      <!-- Spell 2: fix -->
      <g transform="translate(0, 94)">
        <rect x="0" y="0" width="470" height="82" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
        <rect x="10" y="10" width="34" height="34" rx="5" fill="#ffedd5"/>
        <text x="17" y="33" class="font-sans" font-size="18">🧹</text>
        <text x="54" y="28" class="font-hand" font-size="14.5" font-weight="bold" fill="#9a3412">node bin/shipsafe fix</text>
        <text x="54" y="48" class="font-sans" font-size="12" font-weight="600" fill="#4b5563">The Auto-Exorcist: Autonomous chore automator</text>
        <text x="54" y="66" class="font-sans" font-size="11.5" font-weight="700" fill="#ea580c">Auto-syncs .env.example &amp; strips debugger statements</text>
        <rect x="390" y="12" width="68" height="24" rx="4" fill="#ffedd5"/>
        <text x="396" y="28" class="font-sans" font-size="11" font-weight="800" fill="#ea580c">AUTO-FIX</text>
      </g>

      <!-- Spell 3: commit -->
      <g transform="translate(0, 188)">
        <rect x="0" y="0" width="470" height="82" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
        <rect x="10" y="10" width="34" height="34" rx="5" fill="#d1fae5"/>
        <text x="17" y="33" class="font-sans" font-size="18">🎟️</text>
        <text x="54" y="28" class="font-hand" font-size="14.5" font-weight="bold" fill="#047857">node bin/shipsafe commit "..."</text>
        <text x="54" y="48" class="font-sans" font-size="12" font-weight="600" fill="#4b5563">The Golden Seal: Certified atomic pre-flight commit</text>
        <text x="54" y="66" class="font-sans" font-size="11.5" font-weight="700" fill="#047857">Guarantees code passed 100/100 gates before git commit</text>
        <rect x="390" y="12" width="68" height="24" rx="4" fill="#d1fae5"/>
        <text x="398" y="28" class="font-sans" font-size="11" font-weight="800" fill="#047857">ATOMIC</text>
      </g>

      <!-- Spell 4: serve -->
      <g transform="translate(0, 282)">
        <rect x="0" y="0" width="470" height="82" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
        <rect x="10" y="10" width="34" height="34" rx="5" fill="#ede9fe"/>
        <text x="17" y="33" class="font-sans" font-size="18">🌐</text>
        <text x="54" y="28" class="font-hand" font-size="14.5" font-weight="bold" fill="#6b21a8">node bin/shipsafe serve [--port=...]</text>
        <text x="54" y="48" class="font-sans" font-size="12" font-weight="600" fill="#4b5563">The Crystal Portal: Launches local UI on :4100</text>
        <text x="54" y="66" class="font-sans" font-size="11.5" font-weight="700" fill="#6b21a8">Real-time SSE dashboard + embedded SQLite telemetry</text>
        <rect x="390" y="12" width="68" height="24" rx="4" fill="#ede9fe"/>
        <text x="400" y="28" class="font-sans" font-size="11" font-weight="800" fill="#6b21a8">PORTAL</text>
      </g>
    </g>

    <!-- Bablu Wizard at the Terminal Altar -->
    <g transform="translate(35, 450)">
      <ellipse cx="45" cy="55" rx="18" ry="28" class="bablu"/>
      <circle cx="45" cy="18" r="16" class="bablu"/>
      <polygon points="30,10 45,-14 60,10" fill="#111827"/>
      <ellipse cx="45" cy="10" rx="20" ry="5" fill="#ea580c"/>
      <circle cx="40" cy="16" r="2.5" class="bablu-eye"/>
      <circle cx="50" cy="16" r="2.5" class="bablu-eye"/>
      <line x1="45" y1="45" x2="80" y2="40" class="ink-bold"/>
      
      <!-- Terminal Screen on Altar -->
      <rect x="80" y="15" width="360" height="75" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>
      <circle cx="95" cy="28" r="3" fill="#ef4444"/>
      <circle cx="105" cy="28" r="3" fill="#ea580c"/>
      <circle cx="115" cy="28" r="3" fill="#10b981"/>
      <text x="95" y="48" class="font-hand" font-size="11.5" fill="#38bdf8">$ shipsafe scan ➔ 100/100 PASS (43ms)</text>
      <text x="95" y="65" class="font-hand" font-size="11" fill="#4ade80">✔ Zero table locks · Zero config drift · Good to ship!</text>
    </g>

    <!-- Automated Git Hooks Banner -->
    <g transform="translate(20, 550)">
      <rect x="0" y="0" width="470" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
      <text x="15" y="24" class="font-sans" font-size="13" font-weight="800" fill="#111827">Automated Git Hooks:</text>
      <text x="15" y="44" class="font-hand" font-size="11.5" fill="#2563eb">node bin/shipsafe install-hooks  /  uninstall-hooks</text>
    </g>
  </g>

  <!-- PILLAR 2: 10/10 BENCHMARK GAUNTLET (CENTER, Width: 460px) -->
  <g transform="translate(605, 160)">
    <rect x="0" y="0" width="455" height="630" rx="14" fill="#ffffff" class="ink-bold" stroke="#7c3aed"/>
    <rect x="0" y="0" width="455" height="44" rx="14" fill="#ede9fe"/>
    <text x="20" y="28" class="font-sans txt-tag fill-purple">🧪 2. 10/10 EMPIRICAL BENCHMARK GAUNTLET</text>

    <!-- Benchmark Scoreboard -->
    <g transform="translate(20, 60)">
      <!-- Radar Gauge Circle -->
      <g transform="translate(150, 15)">
        <circle cx="60" cy="50" r="45" class="ink"/>
        <circle cx="60" cy="50" r="30" class="ink-thin dashed" stroke="#10b981"/>
        <path d="M 60,50 L 92,26" class="accent-green" stroke-width="4"/>
        <circle cx="60" cy="50" r="6" fill="#10b981"/>
        <text x="35" y="112" class="font-sans" font-size="15" font-weight="900" fill="#047857">10 / 10 CAUGHT</text>
      </g>

      <!-- Head-to-Head Comparison Table -->
      <g transform="translate(10, 135)">
        <rect x="0" y="0" width="415" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
        
        <!-- Table Header -->
        <rect x="0" y="0" width="415" height="32" rx="8" fill="#f1f5f9"/>
        <text x="12" y="21" class="font-sans" font-size="12" font-weight="800" fill="#334155">OUTAGE VECTOR</text>
        <text x="220" y="21" class="font-sans" font-size="12" font-weight="800" fill="#64748b">ESLINT/TSC</text>
        <text x="325" y="21" class="font-sans" font-size="12" font-weight="800" fill="#047857">SHIPSAFE</text>

        <!-- Rows -->
        <text x="12" y="52" class="font-sans" font-size="11.5" fill="#111827">1. Table Lock (NOT NULL)</text>
        <text x="235" y="52" class="font-sans" font-size="12" font-weight="bold" fill="#ef4444">MISSED ✕</text>
        <text x="335" y="52" class="font-sans" font-size="12" font-weight="bold" fill="#10b981">CAUGHT ✔</text>

        <text x="12" y="76" class="font-sans" font-size="11.5" fill="#111827">2. Missing Env in Deploy</text>
        <text x="235" y="76" class="font-sans" font-size="12" font-weight="bold" fill="#ef4444">MISSED ✕</text>
        <text x="335" y="76" class="font-sans" font-size="12" font-weight="bold" fill="#10b981">CAUGHT ✔</text>

        <text x="12" y="100" class="font-sans" font-size="11.5" fill="#111827">3. N+1 Loop in Async Iter</text>
        <text x="235" y="100" class="font-sans" font-size="12" font-weight="bold" fill="#ef4444">MISSED ✕</text>
        <text x="335" y="100" class="font-sans" font-size="12" font-weight="bold" fill="#10b981">CAUGHT ✔</text>

        <text x="12" y="124" class="font-sans" font-size="11.5" fill="#111827">4. Cascading Blast Ripple</text>
        <text x="235" y="124" class="font-sans" font-size="12" font-weight="bold" fill="#ef4444">MISSED ✕</text>
        <text x="335" y="124" class="font-sans" font-size="12" font-weight="bold" fill="#10b981">CAUGHT ✔</text>

        <text x="12" y="144" class="font-sans" font-size="11" font-weight="bold" fill="#64748b">Score Across 10 Scenarios:</text>
        <text x="235" y="144" class="font-sans" font-size="11.5" font-weight="900" fill="#ef4444">0 / 10</text>
        <text x="335" y="144" class="font-sans" font-size="11.5" font-weight="900" fill="#10b981">10 / 10</text>
      </g>
    </g>

    <!-- Test Commands Box -->
    <g transform="translate(30, 375)">
      <rect x="0" y="0" width="395" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="15" y="25" class="font-sans" font-size="14" font-weight="800" fill="#111827">Run Verification Commands:</text>
      <rect x="15" y="38" width="365" height="34" rx="5" fill="#0f172a"/>
      <text x="25" y="60" class="font-hand" font-size="12" fill="#38bdf8">npm test        # 18/18 tests pass (62ms)</text>
      
      <rect x="15" y="80" width="365" height="34" rx="5" fill="#0f172a"/>
      <text x="25" y="102" class="font-hand" font-size="12" fill="#38bdf8">npm run check   # Pre-flight gatekeeper (100/100)</text>
      
      <text x="15" y="126" class="font-hand" font-size="11" font-weight="bold" fill="#047857">npm run benchmark  # Full 10-vector outage gauntlet</text>
    </g>

    <!-- Structural Quality Seal -->
    <g transform="translate(30, 530)">
      <rect x="0" y="0" width="395" height="75" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
      <text x="15" y="24" class="font-sans" font-size="13" font-weight="900" fill="#065f46">🏆 Gold-Standard Repository Structure:</text>
      <text x="15" y="44" class="font-sans" font-size="11.5" fill="#4b5563">Verified by automated architecture test: src/, bin/, tests/,</text>
      <text x="15" y="62" class="font-sans" font-size="11.5" fill="#4b5563">docs/, assets/, and .github/ workflows 100% compliant.</text>
    </g>
  </g>

  <!-- PILLAR 3: NETWORK & TROUBLESHOOTING RUNBOOK (RIGHT, Width: 460px) -->
  <g transform="translate(1085, 160)">
    <rect x="0" y="0" width="445" height="630" rx="14" fill="#ffffff" class="ink-bold" stroke="#2563eb"/>
    <rect x="0" y="0" width="445" height="44" rx="14" fill="#dbeafe"/>
    <text x="20" y="28" class="font-sans txt-tag fill-blue">🔌 3. NETWORK TOPOLOGY &amp; TROUBLESHOOTING</text>

    <!-- Port Topology Table -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="405" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text x="15" y="26" class="font-sans" font-size="14" font-weight="800" fill="#111827">Port &amp; Daemon Map:</text>
      
      <!-- Port 1: 4100 -->
      <g transform="translate(15, 38)">
        <rect x="0" y="0" width="375" height="45" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
        <text x="12" y="20" class="font-hand" font-size="12.5" font-weight="bold" fill="#1e40af">localhost:4100</text>
        <text x="145" y="20" class="font-sans" font-size="11.5" font-weight="bold" fill="#2563eb">ShipSafe Web Portal (SSE)</text>
        <text x="12" y="36" class="font-sans" font-size="10.5" fill="#64748b">Live health gauge, rule editor, and SQLite audit ledger</text>
      </g>

      <!-- Port 2: 11434 -->
      <g transform="translate(15, 92)">
        <rect x="0" y="0" width="375" height="45" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
        <text x="12" y="20" class="font-hand" font-size="12.5" font-weight="bold" fill="#065f46">localhost:11434</text>
        <text x="155" y="20" class="font-sans" font-size="11.5" font-weight="bold" fill="#047857">Local Ollama LLM</text>
        <text x="12" y="36" class="font-sans" font-size="10.5" fill="#64748b">Hosts open models (gemma2:2b / qwen2.5:3b) air-gapped</text>
      </g>
    </g>

    <!-- Offline Fallback Guarantee Box -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="405" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
      <text x="15" y="25" class="font-sans" font-size="13.5" font-weight="900" fill="#065f46">🛡️ Offline Fallback Guarantee:</text>
      <text x="15" y="46" class="font-sans" font-size="12" font-weight="600" fill="#047857">If Ollama daemon is offline or uninstalled,</text>
      <text x="15" y="64" class="font-sans" font-size="12" fill="#4b5563">ShipSafe executes its deterministic synthesizer with</text>
      <text x="15" y="82" class="font-hand" font-size="12" font-weight="bold" fill="#15803d">zero latency impact (&lt;2ms) &amp; zero crashes.</text>
    </g>

    <!-- Troubleshooting Runbook Procedures -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="405" height="260" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="15" y="25" class="font-sans" font-size="14" font-weight="800" fill="#111827">Operator Troubleshooting Procedures:</text>

      <!-- Issue A -->
      <g transform="translate(15, 38)">
        <text x="0" y="14" class="font-sans" font-size="12.5" font-weight="800" fill="#ea580c">Issue A: Port 4100 is already in use</text>
        <rect x="0" y="22" width="375" height="32" rx="4" fill="#0f172a"/>
        <text x="10" y="43" class="font-hand" font-size="11.5" fill="#38bdf8">node bin/shipsafe serve --port=5050</text>
      </g>

      <!-- Issue B -->
      <g transform="translate(15, 110)">
        <text x="0" y="14" class="font-sans" font-size="12.5" font-weight="800" fill="#ef4444">Issue B: Git hook blocked an intentional test trap</text>
        <rect x="0" y="22" width="375" height="32" rx="4" fill="#0f172a"/>
        <text x="10" y="43" class="font-hand" font-size="11.5" fill="#f87171">git commit --no-verify -m "test fixture"</text>
      </g>

      <!-- Issue C -->
      <g transform="translate(15, 182)">
        <text x="0" y="14" class="font-sans" font-size="12.5" font-weight="800" fill="#2563eb">Issue C: Clean and re-initialize audit database</text>
        <rect x="0" y="22" width="375" height="32" rx="4" fill="#0f172a"/>
        <text x="10" y="43" class="font-hand" font-size="11.5" fill="#38bdf8">rm -rf .shipsafe &amp;&amp; node bin/shipsafe scan</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(70, 845)">
    <text x="0" y="0" class="font-hand txt-code" font-size="13" fill="#374151">
      [STYLE: Ian Bablu 16:9 Landscape | Pure White #FFFFFF | Hand-Drawn Ink Linework | Halloween Hack Edition | Bablu IP © TRioN]
    </text>
    <text x="0" y="24" class="font-sans" font-size="13" font-weight="600" fill="#64748b">
      Operator Runbook Specification: 4 CLI Spells → 10/10 Empirical Outage Gauntlet → Daemon Ports &amp; Emergency Procedures.
    </text>
  </g>
</svg>